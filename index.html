<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Versículo del Día — </title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Georgia, serif;
    }
    .card {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 20px 48px rgba(0,0,0,0.55);
      display: block;
    }
    .quote-card {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
    }
    .quote-mark {
      display: block;
      color: #818cf8;
      font-size: 72px;
      line-height: 0.5;
      margin-bottom: 20px;
    }
    .verse-text {
      color: #f1f5f9;
      font-size: 18px;
      line-height: 1.8;
      font-style: italic;
    }
    .reference {
      color: #a5b4fc;
      font-family: -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    a {
      color: #334155;
      font-family: -apple-system, sans-serif;
      font-size: 11px;
      text-decoration: none;
    }
    a:hover { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://www.bible.com/_next/image?url=https%3A%2F%2Fimageproxy.youversionapi.com%2F640x640%2Fhttps%3A%2F%2Fs3.amazonaws.com%2Fstatic-youversionapi-com%2Fimages%2Fbase%2F101687%2F1280x1280.jpg&amp;w=1920&amp;q=75" alt="" class="img" />
    
    <a href="https://www.bible.com/es/verse-of-the-day" target="_blank" rel="noopener">
      bible.com — Versículo del Día
    </a>
  </div>
</body>
</html>
