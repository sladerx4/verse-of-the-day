name: Versículo del Día

on:
  schedule:
    - cron: '0 10 * * *'  # 10am UTC = 7am Argentina
  workflow_dispatch:       # también se puede correr a mano desde GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm install

      - name: Instalar Chromium
        run: npx playwright install chromium --with-deps

      - name: Scrappear y generar index.html
        run: npm run scrape

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "verse: $(date +'%Y-%m-%d')"
          git push
